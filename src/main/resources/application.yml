spring:
  application:
    name: personal-details-app
  main:
    # Faster cold start on small free-tier CPUs
    lazy-initialization: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  # Render injects PORT; falls back to 8080 locally
  port: ${PORT:8080}
  shutdown: graceful
  # Trust X-Forwarded-* from the hosting proxy so cookies/redirects see https
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true     # publishes the info.* keys below
    build:
      enabled: true     # publishes build.version / build.time from build-info

# Rendered at /actuator/info. RENDER_GIT_COMMIT is set by Render for every deploy,
# so this is the git SHA that is actually running.
info:
  app:
    name: Personal Details
    commit: ${RENDER_GIT_COMMIT:unknown}
    branch: ${RENDER_GIT_BRANCH:unknown}
